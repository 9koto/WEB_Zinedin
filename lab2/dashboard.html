<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облік часу - Time Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
        .navbar-brand { font-size: 2rem; font-weight: bold; }
        .nav-link { color: #fff !important; }
        .nav-link:hover { color: #ffd700 !important; }
        body { background-image: url('https://images.unsplash.com/photo-1501139083538-0139583c0608'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; }
        main { background-color: rgba(255, 255, 255, 0.8); border-radius: 10px; padding: 20px; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Time Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Вхід</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Реєстрація</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Профіль</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Про додаток</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Облік часу</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <h1 class="text-center mb-4">Облік робочого часу</h1>
        <div class="w-50 mx-auto">
            <div class="mb-3">
                <label for="session-name" class="form-label">Назва сеансу</label>
                <input type="text" class="form-control" id="session-name" placeholder="Введіть назву сеансу">
            </div>
            <div class="mb-3 text-center">
                <h3 id="timer-display">Час: 0 сек</h3>
            </div>
            <div class="text-center mb-3">
                <button id="start-timer" class="btn btn-success me-2">Старт</button>
                <button id="pause-timer" class="btn btn-warning me-2">Пауза</button>
                <button id="stop-timer" class="btn btn-danger">Стоп</button>
            </div>
            <h4>Список сеансів</h4>
            <ul id="session-list" class="list-group"></ul>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p>© 2025 Time Tracker. Усі права захищено.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/controller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
